name: update

on:
  # Every 3 days at 04:37 UTC (= Beijing 12:37)
  schedule:
    - cron: "37 4 */3 * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream branch/tag/ref to build (empty = main)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve upstream ref
        id: resolve
        run: |
          set -eu
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then REF="main"; fi
          echo "REF=$REF" >> "$GITHUB_OUTPUT"

      # Check out the UPSTREAM repository directly — its own Dockerfile
      # (frontend pnpm build + backend) is used as-is.
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: ZiChuanLan/freebie-radar
          ref: ${{ steps.resolve.outputs.REF }}
          path: src
          fetch-depth: 1

      - name: Record upstream commit
        id: meta
        run: |
          set -eu
          cd src
          SHA="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y%m%d)"
          echo "TAG=${DATE}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/sebrinass/freebie-radar-docker:latest
            ghcr.io/sebrinass/freebie-radar-docker:${{ steps.meta.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha

      - name: Smoke test (container starts and health endpoint responds)
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64
          load: true
          tags: radar-smoke:local
          cache-from: type=gha

      - name: Run smoke test
        run: |
          set -eu
          docker rm -f radar-smoke 2>/dev/null || true
          docker run -d --name radar-smoke -e PORT=8788 -e HOST=0.0.0.0 -e DATABASE_PATH=/tmp/radar.db radar-smoke:local
          sleep 10
          ok=0
          for i in $(seq 1 12); do
            if docker exec radar-smoke node -e 'fetch("http://127.0.0.1:8788/health").then(r=>{console.log("health",r.status);process.exit(r.ok?0:1)}).catch(()=>process.exit(1))'; then
              ok=1
              break
            fi
            echo "health probe $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "smoke test FAILED - dumping container logs"
            docker logs radar-smoke || true
            exit 1
          fi
          echo "smoke test OK"

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --method PATCH "/user/packages/container/freebie-radar-docker" -f visibility=public; then
            echo "GHCR package visibility set to public"
          else
            echo "::warning::Could not set GHCR package visibility automatically. Set it manually: repo Settings -> Packages -> freebie-radar-docker -> public."
          fi
